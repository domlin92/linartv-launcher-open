plugins {
    id 'com.android.application'
}

// Release signing is read from keystore.properties in the project root.
// That file and the keystore itself are created by scripts/create-keystore.ps1
// and are ignored by Git. Never commit them.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.linart.tvpreview'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.domlin92.linartv.open'
        minSdk 26
        targetSdk 28
        // Increase versionCode by 1 for every published release.
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "LinarTV-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // LinarTV is distributed through GitHub Releases and Downloader, not Google Play.
        // targetSdk 28 is deliberate: raising it changes launcher behaviour on newer TVs
        // (e.g. package visibility for the app dock) and needs its own migration.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.google.zxing:core:3.5.4'
}
